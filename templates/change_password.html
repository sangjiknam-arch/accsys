{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="login-card card">
  <h1>관리자 비밀번호 변경</h1>
  <form method="post">
    <label>현재 비밀번호</label>
    <input type="password" name="current_password" required autofocus inputmode="numeric">

    <label>새 비밀번호</label>
    <input type="password" name="new_password" required minlength="8" maxlength="8" pattern="[0-9]{8}" inputmode="numeric" placeholder="숫자 8자리">

    <label>새 비밀번호 확인</label>
    <input type="password" name="confirm_password" required minlength="8" maxlength="8" pattern="[0-9]{8}" inputmode="numeric" placeholder="숫자 8자리">

    <button class="primary" type="submit">비밀번호 변경</button>
  </form>
</div>
{% endblock %}
