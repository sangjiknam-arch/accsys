{% extends "base.html" %}
{% block title %}로그인{% endblock %}

{% block content %}
<div class="login-card card">
    <h1>교회 회계 로그인</h1>

    <form method="post">
        <label>아이디</label>
        <input name="userid" required autofocus>

        <br>

        <label>비밀번호</label>
        <input type="password" name="password" required>

        <button class="primary">로그인</button>
    </form>
</div>
{% endblock %}
